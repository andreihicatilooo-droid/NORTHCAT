<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>NORTHCAT — Mini App</title>
    <meta name="description" content="NORTHCAT Web3 Mini App: запись на тату, оплата депозита в TON через TON Connect.">
    <meta name="theme-color" content="#07080a">
    <link rel="icon" type="image/jpeg" href="cat_circle.jpg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Grenze+Gotisch:wght@400;500;600;700;800;900&family=Montserrat:wght@300;400;600;700;800&display=swap" rel="stylesheet">

    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        :root {
            --bg: #07080a;
            --surface: #111218;
            --surface-2: #181a22;
            --pink: #ff3b77;
            --purple: #9d26cd;
            --text: #f4f4f7;
            --muted: #8c8b96;
            --dim: #5b5b66;
            --border: rgba(255,255,255,.08);
            --ok: #3ad29f;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Montserrat', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 16px 16px calc(24px + env(safe-area-inset-bottom));
            background-image:
                radial-gradient(circle at 12% 8%, rgba(157,38,205,.12), transparent 40%),
                radial-gradient(circle at 88% 90%, rgba(255,59,119,.10), transparent 42%);
        }
        h1, h2, h3, .display { font-family: 'Pirata One', 'Grenze Gotisch', serif; font-weight: 700; letter-spacing: .5px; }

        .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
        .brand { font-family: 'Pirata One', 'Grenze Gotisch', serif; font-size: 1.5rem; letter-spacing: 1px; }
        .brand span { color: var(--pink); }
        .hello { font-size: .72rem; color: var(--muted); text-align: right; line-height: 1.4; }

        .hero {
            background: linear-gradient(150deg, var(--surface), var(--surface-2));
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 22px 18px;
            margin-bottom: 16px;
            position: relative;
            overflow: hidden;
        }
        .hero::after {
            content: "✦"; position: absolute; right: -6px; top: -16px;
            font-size: 7rem; color: rgba(255,59,119,.07); pointer-events: none;
        }
        .hero h1 { font-size: 1.9rem; margin-bottom: 6px; }
        .hero p { color: var(--muted); font-size: .85rem; max-width: 90%; }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 16px;
            cursor: pointer;
            transition: transform .15s, border-color .2s;
        }
        .card:active { transform: scale(.97); border-color: var(--pink); }
        .card .ico { font-size: 1.5rem; display: block; margin-bottom: 8px; color: var(--pink); }
        .card h3 { font-size: 1rem; margin-bottom: 4px; }
        .card p { font-size: .72rem; color: var(--muted); }

        .section-title { font-size: 1.25rem; margin: 22px 0 12px; }

        .price-row {
            display: flex; align-items: center; justify-content: space-between;
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 12px; padding: 12px 14px; margin-bottom: 8px;
        }
        .price-row .pr-name { font-size: .9rem; }
        .price-row .pr-name small { display: block; color: var(--dim); font-size: .68rem; }
        .price-row .pr-val { font-family: 'Pirata One', 'Grenze Gotisch', serif; font-size: 1.15rem; color: var(--pink); }

        .btn {
            display: block; width: 100%; text-align: center; border: none; cursor: pointer;
            border-radius: 12px; padding: 14px; font-size: .9rem; font-weight: 700;
            letter-spacing: .5px; font-family: 'Montserrat', sans-serif;
        }
        .btn-primary { background: linear-gradient(135deg, var(--pink), var(--purple)); color: #fff; }
        .btn-primary:disabled { opacity: .5; }
        .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text); margin-top: 10px; }

        .note { font-size: .72rem; color: var(--dim); text-align: center; margin-top: 14px; line-height: 1.5; }
        .toast {
            position: fixed; left: 16px; right: 16px; bottom: 18px;
            background: var(--surface-2); border: 1px solid var(--pink);
            border-radius: 12px; padding: 14px; font-size: .82rem;
            transform: translateY(140%); transition: transform .35s; z-index: 50;
            box-shadow: 0 12px 40px rgba(0,0,0,.5);
        }
        .toast.show { transform: translateY(0); }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="topbar">
        <div class="brand">NORTH<span>CAT</span></div>
        <div class="hello" id="hello">Web3 Mini App</div>
    </div>

    <div class="hero">
        <h1>Тату-студия в Telegram</h1>
        <p>Запишитесь на сеанс прямо здесь.</p>
    </div>

    <div class="grid">
        <div class="card" data-action="book">
            <span class="ico">✶</span>
            <h3>Запись</h3>
            <p>Оставить заявку мастеру</p>
        </div>
        <div class="card" data-action="works">
            <span class="ico">☩</span>
            <h3>Работы</h3>
            <p>Портфолио студии</p>
        </div>
        <div class="card" data-action="contacts">
            <span class="ico">◎</span>
            <h3>Контакты</h3>
            <p>Адрес, связь, карта</p>
        </div>
    </div>

    <h2 class="section-title">Примерная стоимость</h2>
    <div id="priceList"></div>

    <div style="margin: 24px 0;">
        <button class="btn btn-primary" id="bookBtn">Записаться на сеанс</button>
    </div>

    <p class="note">NORTHCAT · northcat.top · <a href="https://t.me/N0RTHCAT" style="color:var(--pink);">@N0RTHCAT</a></p>

    <div class="toast" id="toast"></div>

    <script src="js/data.js"></script>
    <script>
        (function () {
            const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;

            const $ = s => document.querySelector(s);
            function toast(msg) {
                const t = $('#toast');
                t.textContent = msg;
                t.classList.add('show');
                clearTimeout(toast._t);
                toast._t = setTimeout(() => t.classList.remove('show'), 3200);
            }

            /* ---------- Telegram WebApp init ---------- */
            if (tg) {
                tg.ready();
                tg.expand();
                tg.setHeaderColor && tg.setHeaderColor('#07080a');
                tg.setBackgroundColor && tg.setBackgroundColor('#07080a');
                const u = tg.initDataUnsafe && tg.initDataUnsafe.user;
                if (u) $('#hello').textContent = 'Привет, ' + (u.first_name || 'друг') + '!';
            } else {
                $('#hello').textContent = 'Откройте в Telegram';
            }

            /* ---------- Прайс ---------- */
            if (typeof PRICING !== 'undefined') {
                $('#priceList').innerHTML = PRICING.map(p => `
                    <div class="price-row">
                        <div class="pr-name">${p.name}<small>${p.ex}</small></div>
                        <div class="pr-val">${p.val} ${p.unit}</div>
                    </div>`).join('');
            }

            /* ---------- Действия карточек ---------- */
            document.querySelectorAll('.card').forEach(c => {
                c.addEventListener('click', () => {
                    const a = c.dataset.action;
                    const map = {
                        book: 'index.html#booking',
                        works: 'index.html#works',
                        contacts: 'contacts.html'
                    };
                    if (tg && tg.openLink) tg.openLink('https://northcat.top/' + map[a]);
                    else window.open(map[a], '_blank');
                });
            });

            /* ---------- Запись без депозита ---------- */
            $('#bookBtn').addEventListener('click', () => {
                sendToBot({ type: 'booking_request' });
                if (tg && tg.openTelegramLink) tg.openTelegramLink('https://t.me/N0RTHCAT');
                else window.open('https://t.me/N0RTHCAT', '_blank');
            });

            /* ---------- Отправка данных боту ---------- */
            function sendToBot(payload) {
                if (tg && tg.sendData) {
                    try { tg.sendData(JSON.stringify(payload)); } catch (e) { /* noop */ }
                }
            }
        })();
    </script>
</body>
</html>
